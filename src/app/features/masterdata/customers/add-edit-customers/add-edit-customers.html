<section class="p-3">
 <div class="card p-3">
  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-3">
   <h2 class="fw-bold h3">
    {{ editMode() ? ('editcustomer') : ('addNewcustomer') }}
   </h2>
  </div>

  <!-- Form -->
  <form [formGroup]="customerForm">
   <div class="row g-3">
    <!-- Name -->
    <div class="col-md-6">
     <label for="name" class="form-label">{{ 'name' }} <span class="text-danger">*</span></label>
     <input id="name" type="text" class="form-control" formControlName="name" />
     <div *ngIf="customerForm.get('name')?.touched && customerForm.get('name')?.invalid" class="text-danger small">
      {{ 'Name ia Required' }}
     </div>
    </div>

    <!-- Serial -->
    <div class="col-md-6">
     <label for="serial" class="form-label">{{ 'serial' }} <span class="text-danger">*</span></label>
     <input id="serial" type="text" class="form-control" formControlName="serial" />
     <div *ngIf="customerForm.get('serial')?.touched && customerForm.get('serial')?.invalid" class="text-danger small">
      {{ 'Serial Is Required' }}
     </div>
    </div>

    <!-- Phone -->
    <div class="col-md-6">
     <label for="phone" class="form-label">{{ 'phone' }}</label>
     <input id="phone" type="text" class="form-control" formControlName="phone" />
     <div *ngIf="customerForm.get('phone')?.dirty && customerForm.get('phone')?.getError('pattern')"
      class="text-danger small">
      {{ 'mobile1 must be exactly 11 digits or More' }}
     </div>
    </div>

    <!-- Email -->
    <div class="col-md-6">
     <label for="email" class="form-label">{{ 'email' }}</label>
     <input id="email" type="email" class="form-control" formControlName="email" />
     <div *ngIf="customerForm.get('email')?.getError('email')" class="text-danger small">
      {{ 'Invalid email address' }}
     </div>
    </div>

    <!-- National ID -->
    <div class="col-md-6">
     <label for="nationalId" class="form-label">{{ 'nationalId' }}</label>
     <input id="nationalId" type="text" class="form-control" formControlName="nationalId" />
     <div *ngIf="customerForm.get('nationalId')?.dirty && customerForm.get('nationalId')?.getError('pattern')"
      class="text-danger small">
      {{ 'National Id must be exactly 14 digits' }}

     </div>
    </div>

    <!-- Address -->
    <div class="col-md-6">
     <label for="address" class="form-label">{{ 'address' }}</label>
     <input id="address" type="text" class="form-control" formControlName="address" />
    </div>

    <!-- Responsable Man Name -->
    <div class="col-md-6">
     <label for="responsableManName" class="form-label">{{ 'responsableManName' }}</label>
     <input id="responsableManName" type="text" class="form-control" formControlName="responsableManName" />
    </div>

    <!-- Notes -->
    <div class="col-md-6">
     <label for="notes" class="form-label">{{ 'notes' }}</label>
     <textarea id="notes" class="form-control" rows="2" formControlName="notes"></textarea>
    </div>

    <!-- Checkboxes -->
    <div class="col-md-12 d-flex gap-3 mt-2">


     <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="isCustomer" formControlName="isCustomer">

      <label class="form-check-label" for="isCustomer">
       {{' isCustomer' }}
      </label>
     </div>

     <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="isSupplier" formControlName="isSupplier">

      <label class="form-check-label" for="isSupplier">
       {{' isSupplier' }}
      </label>
     </div>
    </div>
   </div>

   <!-- Buttons -->
   <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-light" (click)="handleClose()">{{ 'cancel' }}</button>
    <button type="submit" class="btn" (click)="saveCustomer()" [ngClass]="editMode() ? 'btn-warning' : 'btn-primary'">
     {{ editMode() ? ('editCustomer') : ('saveCustomer') }}
    </button>
   </div>
  </form>
 </div>
</section>
