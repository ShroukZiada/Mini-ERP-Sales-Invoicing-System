<div class="card shadow-sm p-3">

 <!-- Header -->
 <div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="m-0">{{ title }}</h5>
  <button *ngIf="showAddButton" class="btn btn-primary" (click)="add.emit()">+ Add</button>
 </div>

 <!-- Search -->
 <div class="mb-3">
  <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchTerm" (input)="onSearch()">
 </div>

 <!-- Table -->
 <table class="table table-bordered table-hover text-center">
  <thead class="table-light">
   <tr>
    <th *ngFor="let col of columns">{{ col.header }}</th>
    <th *ngIf="showActions">Actions</th>
   </tr>
  </thead>
  <tbody>
   <tr *ngFor="let row of paginatedData">
    <td *ngFor="let col of columns">{{ row[col.field] }}</td>
    <td *ngIf="showActions">
     <button class="btn btn-sm btn-info me-1" (click)="view.emit(row)">View</button>
     <button class="btn btn-sm btn-warning me-1" (click)="edit.emit(row)">Edit</button>
     <button class="btn btn-sm btn-danger" (click)="delete.emit(row)">Delete</button>
    </td>
   </tr>
  </tbody>
 </table>

 <!-- Pagination -->
 <div class="d-flex justify-content-center mt-3" *ngIf="totalPages > 1">
  <button class="btn btn-sm btn-outline-secondary me-2" *ngFor="let page of [].constructor(totalPages); let i = index"
   [class.active]="currentPage === i + 1" (click)="changePage(i + 1)">
   {{ i + 1 }}
  </button>
 </div>

</div>
