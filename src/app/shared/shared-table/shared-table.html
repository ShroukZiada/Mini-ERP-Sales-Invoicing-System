<div class="card shadow-sm p-4" [dir]="'rtl'">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="m-0 fw-bold">{{ title }}</h5>
    <button *ngIf="showAddButton" class="btn btn-primary btn-sm" (click)="add.emit()">
      <i class="fa-solid fa-plus"></i> إضافه

    </button>
  </div>

  <!-- Search -->
  <div class="mb-3">
    <input type="text" class="form-control form-control-sm" placeholder="Search..." [(ngModel)]="searchTerm"
      (input)="onSearch()">
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle text-center mb-0">
      <thead class="table-dark">
        <tr>
          <th *ngFor="let col of columns" class="text-uppercase text-nowrap">
            {{ col.header }}
          </th>
          <th *ngIf="showActions" class="text-uppercase">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of paginatedData" class="align-middle">
          <td *ngFor="let col of columns" class="text-nowrap">
            {{ row[col.field] }}
          </td>
          <td *ngIf="showActions">
            <div class="d-flex justify-content-center gap-1">
              <button class="btn btn-sm btn-info" (click)="view.emit(row)">
                <i class="fa-solid fa-eye"></i>
              </button>
              <button class="btn btn-sm btn-warning" (click)="edit.emit(row)">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-sm btn-danger" (click)="delete.emit(row)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="paginatedData.length === 0">
          <td [attr.colspan]="columns.length + (showActions ? 1 : 0)" class="text-center py-3">
            لا يوجد بيانات
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-center mt-4" *ngIf="totalPages > 1">
    <nav aria-label="Table pagination">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">
            &laquo;
          </button>
        </li>
        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1">
          <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="changePage(currentPage + 1)">
            &raquo;
          </button>
        </li>
      </ul>
    </nav>
  </div>

</div>
